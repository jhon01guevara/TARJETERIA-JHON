<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelos Tarjetería John</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" integrity="sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3" crossorigin="anonymous"></script>
<style>
  :root {
    --bg:#F2F2F5; --card:#fff; --text:#1D1D1F; --muted:#6E6E73; --line:#E4E4E9; --soft:#F5F5F7;
    --brand:#E0457B; --brand-bg:rgba(224,69,123,.10);
    --accent:#2fa84f; --accent2:#FF9F0A; --chip:var(--soft);
    --r:20px; --rs:12px; --sh:0 1px 2px rgba(0,0,0,.04),0 10px 26px -14px rgba(0,0,0,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1c1c1e; --card:#2c2c2e; --text:#f5f5f7; --muted:#9b9ba1; --line:#3a3a3c; --soft:#3a3a3c; --accent:#48c26c; --accent2:#ffb340; --chip:var(--soft); }
  }
  :root[data-theme="dark"] { --bg:#1c1c1e; --card:#2c2c2e; --text:#f5f5f7; --muted:#9b9ba1; --line:#3a3a3c; --soft:#3a3a3c; --accent:#48c26c; --accent2:#ffb340; --chip:var(--soft); }
  * { box-sizing:border-box; }
  ::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 45%,transparent);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
  body { margin:0 auto; max-width:none; background:var(--bg)
      radial-gradient(900px 560px at 15% -12%, rgba(224,69,123,.08), transparent 60%),
      radial-gradient(800px 640px at 105% 0%, rgba(15,108,189,.05), transparent 55%);
    background-attachment:fixed; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI Variable','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;
    letter-spacing:-.011em; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top,16px) clamp(14px,2.5vw,36px) env(safe-area-inset-bottom,24px); }
  h1 { font-size:1.2rem; margin:10px 0 8px; font-weight:700; letter-spacing:-.02em; }
  .brand { text-align:center; }
  .logoFrame {
    display:inline-block; margin-top:4px; padding:10px;
    background: linear-gradient(145deg, #fdfdfd, #e2e2e2);
    border-radius: var(--r);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -2px 4px rgba(0,0,0,.18) inset,
      0 2px 3px rgba(255,255,255,.6),
      0 8px 16px rgba(0,0,0,.22),
      0 2px 4px rgba(0,0,0,.15);
    border: 1px solid rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .logoFrame {
      background: linear-gradient(145deg, #333, #1a1a1a);
      box-shadow:
        0 1px 0 rgba(255,255,255,.08) inset,
        0 -2px 4px rgba(0,0,0,.5) inset,
        0 2px 3px rgba(255,255,255,.05),
        0 8px 18px rgba(0,0,0,.55),
        0 2px 4px rgba(0,0,0,.4);
      border-color: rgba(255,255,255,.08);
    }
  }
  :root[data-theme="dark"] .logoFrame {
    background: linear-gradient(145deg, #333, #1a1a1a);
    box-shadow:
      0 1px 0 rgba(255,255,255,.08) inset,
      0 -2px 4px rgba(0,0,0,.5) inset,
      0 2px 3px rgba(255,255,255,.05),
      0 8px 18px rgba(0,0,0,.55),
      0 2px 4px rgba(0,0,0,.4);
    border-color: rgba(255,255,255,.08);
  }
  .logoFrame img.logoImg {
    display:block; border-radius:9px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.15) inset;
    background:#fff;
  }
  @media print { .logoFrame { box-shadow:none; border:1px solid #999; background:#fff; } }
  .logoImg { max-width:180px; width:60%; height:auto; margin:4px auto 0; display:inline-block; }
  .sticky { position:sticky; top:env(safe-area-inset-top,0px);
    background:color-mix(in srgb,var(--card) 72%,transparent);
    backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid color-mix(in srgb,var(--line) 60%,transparent);
    border-radius:var(--r); box-shadow:var(--sh); padding:12px 14px 10px; margin:0 0 12px; z-index:2; }
  #q { width:100%; padding:11px 13px; font-size:1rem; border:1px solid transparent; border-radius:var(--rs);
    background:var(--soft); color:var(--text); transition:box-shadow .12s,background .12s; }
  #q:focus { outline:none; background:var(--card); box-shadow:0 0 0 4px var(--brand-bg); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; }
  .chip { flex-shrink:0; padding:7px 13px; border:0; border-radius:999px; background:var(--soft);
    color:var(--text); font-size:.8rem; font-weight:600; transition:background .15s,color .15s; }
  .chip.on { background:var(--brand); color:#fff; box-shadow:0 2px 8px rgba(224,69,123,.35); }
  .info { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.8rem; margin-top:8px; }
  .info label { display:flex; gap:6px; align-items:center; }
  .toolbar { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:10px 0 4px; }
  .toolbar button { padding:10px 4px; border:0; background:var(--soft); color:var(--text);
    border-radius:999px; font-size:.8rem; font-weight:600; transition:background .15s,transform .1s; }
  .toolbar button:active { transform:scale(.96); }
  .status { font-size:.78rem; color:var(--muted); min-height:1.1em; margin-top:4px; }
  #list { display:flex; flex-direction:column;
    background:color-mix(in srgb,var(--card) 78%,transparent);
    backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid color-mix(in srgb,var(--line) 55%,transparent);
    border-radius:var(--r); box-shadow:var(--sh); padding:4px 12px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent); }
  #list .row:last-child { border-bottom:0; }
  .row input[type=checkbox] { width:20px; height:20px; flex-shrink:0; accent-color:var(--accent); }
  .checks { display:flex; flex-direction:row; gap:10px; flex-shrink:0; }
  .ck { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.58rem; color:var(--muted); line-height:1; font-weight:600; }
  .ck.ck2 input { accent-color:var(--accent2); }
  .row.sacado { background:var(--brand-bg); border-radius:var(--rs); }
  .row.sacado .desc { color:color-mix(in srgb,var(--accent2) 75%,var(--text)); }
  .qrow { display:flex; gap:6px; margin-top:5px; }
  .qsel, .qother { padding:6px 8px; font-size:.82rem; border:1px solid transparent; border-radius:8px; background:var(--soft); color:var(--text); }
  .qsel { min-width:0; } .qother { width:84px; } .qother[hidden] { display:none; }
  .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .code { font-family:"SF Mono",Menlo,monospace; font-weight:700; }
  .desc { font-size:.82rem; color:var(--muted); }
  .thumb { width:96px; height:auto; max-height:80px; object-fit:contain; border-radius:var(--rs);
    border:1px solid color-mix(in srgb,var(--line) 70%,transparent); background:var(--soft); flex-shrink:0; cursor:zoom-in; }
  body.nophotos .thumb { display:none; }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #lb.on { display:flex; }
  #lb img { max-width:100%; max-height:78vh; border-radius:var(--rs); background:#fff; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  #lb p { color:#fff; margin:12px 0 0; font-weight:700; text-align:center; letter-spacing:-.01em; }
  #lb small { color:#ccc; font-weight:400; display:block; }
  .row.checked .code { text-decoration:line-through; color:var(--muted); }
  .total { display:flex; justify-content:space-between; gap:8px; margin-top:8px; padding:12px 14px; border-radius:var(--r);
    background:color-mix(in srgb,var(--card) 78%,transparent); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid color-mix(in srgb,var(--line) 55%,transparent); box-shadow:var(--sh); font-size:.9rem; }
  .total b { color:var(--brand); font-size:1.08rem; font-weight:700; }
  .biz { width:100%; padding:11px 13px; font-size:1rem; font-weight:600; border:1px solid transparent; border-radius:var(--rs);
    background:var(--soft); color:var(--text); margin-bottom:8px; }
  .biz:focus { outline:none; background:var(--card); box-shadow:0 0 0 4px var(--brand-bg); }
  @media print { .biz { border:none; padding:0; font-size:1.1rem; background:none; } }
  .jobbar { display:flex; gap:6px; margin-bottom:4px; }
  .jobbar select { flex:1; min-width:0; padding:10px 9px; font-size:.9rem; border:1px solid transparent; border-radius:999px; background:var(--soft); color:var(--text); }
  .jobbar button { flex-shrink:0; padding:9px 14px; font-size:.85rem; font-weight:600; border:0; border-radius:999px; background:var(--soft); color:var(--text); }
  .jobbar button.danger { color:#d92d20; background:color-mix(in srgb,#d92d20 12%,transparent); }
  .jobLabel { font-size:.78rem; color:var(--muted); margin:-2px 0 8px; padding:0 2px; }
  @media print { .jobbar { display:none !important; } }
  .row[hidden] { display:none !important; }
  .empty { text-align:center; color:var(--muted); padding:30px 0; }
  .reset { display:block; margin:24px auto 10px; background:var(--soft); border:0; color:var(--muted);
    padding:10px 18px; border-radius:999px; font-size:.85rem; font-weight:600; }
  .addbtn { display:block; width:100%; padding:11px; margin:8px 0 2px; border:1.5px dashed color-mix(in srgb,var(--brand) 45%,var(--line));
    background:var(--brand-bg); color:var(--brand); border-radius:var(--rs); font-size:.85rem; font-weight:600; }
  .addbox { display:flex; flex-direction:column; gap:8px; padding:14px; margin:8px 0;
    background:color-mix(in srgb,var(--card) 78%,transparent); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid color-mix(in srgb,var(--line) 55%,transparent); border-radius:var(--r); box-shadow:var(--sh); }
  .addbox input { padding:10px 12px; border:1px solid transparent; border-radius:var(--rs); background:var(--soft); color:var(--text); font-size:.9rem; }
  .addbox input:focus { outline:none; background:var(--card); box-shadow:0 0 0 4px var(--brand-bg); }
  .addbox .row2 { display:flex; gap:8px; }
  .addbox .row2 button { flex:1; padding:10px; border-radius:999px; border:0; background:var(--soft); color:var(--text); font-weight:600; }
  .addbox .row2 button:first-child { background:var(--brand); color:#fff; box-shadow:0 3px 10px rgba(224,69,123,.35); }
  .addImgLabel { display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--muted); font-weight:600; }
  .addImgLabel input[type=file] { font-size:.78rem; color:var(--text); }
  .addImgPreview { max-width:140px; max-height:110px; object-fit:contain; border-radius:var(--rs); border:1px solid var(--line); background:var(--soft); }
  .row.custom { border-left:3px solid var(--accent2); padding-left:6px; }
  .delRow { flex-shrink:0; width:26px; height:26px; border-radius:50%; border:0; background:color-mix(in srgb,#d92d20 12%,transparent);
    color:#d92d20; font-size:.85rem; }
  @media print {
    @page { size: 8.5in 14in; margin: 0.4in; }
    body { background:#fff !important; }
    .sticky .chips, #q, .toolbar, .status, .reset, .info label { display:none !important; }
    .sticky, #list, .total, .addbox { background:#fff !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; box-shadow:none !important; border-color:#ccc !important; }
    .row.hide { display:none !important; }
    .row:not(.checked):not(.sacado) { display:none !important; }
  }

  /* ===== Check amplio: aprovecha todo el ancho ===== */
  .logoImg { max-width:220px; }
  @media (min-width:700px) {
    h1 { font-size:1.5rem; }
    .toolbar { grid-template-columns:repeat(6,1fr); gap:10px; }
    .toolbar button { padding:12px 6px; font-size:.9rem; }
    #q, .biz { font-size:1.05rem; }
    .jobbar select { font-size:1rem; }
    .chip { font-size:.88rem; padding:8px 15px; }
    .total { font-size:1rem; }
    .thumb { width:130px; max-height:110px; }
    .row { padding:14px 6px; gap:16px; }
    .desc { font-size:.9rem; }
    .addbox { max-width:none; }
  }
  @media (min-width:1000px) {
    #list { display:grid; grid-template-columns:1fr 1fr; column-gap:32px; padding:6px 22px; }
  }
  @media (min-width:1700px) {
    #list { grid-template-columns:1fr 1fr 1fr; }
  }
  @media print { #list { display:flex !important; flex-direction:column; } }

  /* ===== Sin bisel detrás del logo ===== */
  .logoFrame, :root[data-theme="dark"] .logoFrame, :root:not([data-theme="light"]) .logoFrame {
    background:none !important; box-shadow:none !important; border:0 !important; padding:0 !important; border-radius:0 !important; }
  .logoFrame img.logoImg { box-shadow:none !important; }

  /* ===== Logo sin fondo blanco ===== */
  .logoFrame img.logoImg { background:transparent !important; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .logoFrame img.logoImg { filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px rgba(255,255,255,.55)); }
  }
  :root[data-theme="dark"] .logoFrame img.logoImg { filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px rgba(255,255,255,.55)); }

  /* ===== Título con color visible en cualquier fondo ===== */
  h1 { color:var(--brand) !important; text-align:center; }

  /* ===== Optimización móvil: sin elementos superpuestos ===== */
  .addbox[hidden] { display:none !important; }
  @media (max-width:640px) {
    body { padding-left:12px; padding-right:12px; }
    h1 { font-size:1.1rem; margin:8px 0 10px; }
    .logoImg { max-width:150px; }
    /* panel superior: ya no flota sobre la lista */
    .sticky { position:static; padding:10px 12px; }
    .info { flex-direction:column; align-items:flex-start; gap:6px; }
    .info > span:last-child { gap:6px 14px !important; }
    .total { flex-wrap:nowrap; gap:4px; padding:10px 10px; font-size:.74rem; justify-content:space-between; }
    .total > span { white-space:nowrap; }
    .total b { font-size:1rem; }
    .toolbar { gap:6px; }
    .toolbar button { padding:10px 2px; font-size:.74rem; }
    .jobbar { flex-wrap:wrap; }
    .jobbar select { flex:1 1 100%; }
    .jobbar button { flex:1; }
    /* filas: texto + foto arriba, checks abajo */
    #list { padding:4px 10px; }
    .row { display:grid; grid-template-columns:minmax(0,1fr) auto;
      grid-template-areas:"txt thumb" "checks checks"; align-items:start; gap:8px 12px; padding:12px 2px; position:relative; }
    .row .txt { grid-area:txt; }
    .row .thumb { grid-area:thumb; width:96px; max-height:84px; align-self:start; }
    .row .checks { grid-area:checks; gap:22px; justify-content:flex-start; flex-wrap:wrap; }
    .row .ck { flex-direction:row; gap:7px; font-size:.78rem; }
    .row input[type=checkbox] { width:24px; height:24px; }
    .row .delRow { grid-area:checks; justify-self:end; align-self:center; }
    .code { font-size:1rem; }
    .desc { font-size:.85rem; overflow-wrap:anywhere; }
    .qrow { flex-wrap:wrap; }
    .qsel { flex:1 1 120px; min-width:120px; padding:9px 10px; font-size:.9rem; }
    .qother { flex:1 1 90px; width:auto; padding:9px 10px; }
    .addbox input { font-size:1rem; }
    #lb img { max-height:70vh; }
  }
  @media (max-width:380px) {
    .toolbar button { font-size:.68rem; }
    .row .checks { gap:14px; }
  }
</style>
</head>

<h1>Modelos — Tarjetería John 2026</h1>
<input id="biz" class="biz" type="text" placeholder="🏪 Nombre del negocio" autocomplete="off">
<div class="jobbar">
  <select id="jobSelect"></select>
  <button data-act="saveJob">💾 Guardar</button>
  <button class="danger" data-act="deleteJob" aria-label="Eliminar trabajo">🗑</button>
</div>
<div class="jobLabel" id="jobLabel"></div>
<div class="sticky">
  <input id="q" type="search" placeholder="Buscar: 10, PW036, C8, boda…" inputmode="search" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="info"><span id="count"></span><span style="display:flex;gap:12px;flex-wrap:wrap"><label><input type="checkbox" id="showPics" checked> Fotos</label><label><input type="checkbox" id="onlyPending"> Solo pendientes</label><label><input type="checkbox" id="onlySelected"> Solo seleccionadas</label></span></div>
  <div class="total"><span>Total: <b id="totAll">0</b> pcs</span><span>Acotejado: <b id="totDone">0</b> pcs</span><span>Sacado: <b id="totOut">0</b> pcs</span></div>
</div>
<div class="toolbar">
  <button data-act="saveNow">💾 Guardar</button>
  <button data-act="exportJSON">⬇️ Exportar</button>
  <button data-act="impClick">⬆️ Importar</button>
  <button data-act="print">🖨️ Imprimir</button>
  <button data-act="shareList">📤 Compartir</button>
  <button data-act="checkVisibleOn">✔ Marcar visibles</button>
</div>
<button class="addbtn" type="button" data-act="toggleAddBox">➕ Agregar modelo no listado</button>
<div class="addbox" id="addbox" hidden>
  <input id="addCode" placeholder="Código (ej. NUEVO1)" autocomplete="off">
  <input id="addDesc" placeholder="Descripción" autocomplete="off">
  <label class="addImgLabel">📷 Foto (opcional)
    <input id="addImg" type="file" accept="image/*" capture="environment">
  </label>
  <img id="addImgPreview" class="addImgPreview" alt="Vista previa" hidden>
  <div class="row2">
    <button type="button" data-act="confirmAddCustom">Agregar</button>
    <button type="button" data-act="cancelAddBox">Cancelar</button>
  </div>
</div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div class="status" id="status"></div>
<div id="list"></div>
<div class="empty" id="empty" hidden>No hay modelos con ese filtro</div>
<button class="reset" data-act="resetAll">Reiniciar</button>

<div id="lb"><img id="lbImg" alt=""><p id="lbCap"></p></div>
<script src="apps/modelos.js"></script>
</body>
</html>
