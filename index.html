/* ========================================================= */
/* --- PLANTILLAS DE FACTURA (12 ESTILOS PROFESIONALES) --- */
/* ========================================================= */
.fa { position: relative; overflow: hidden; transition: all 0.3s ease; }

/* 1. Clasica */
.fa.tpl-clasica { border-top: 5px solid #1a1a1a; }

/* 2. Dorado Elegante */
.fa.tpl-dorado { border-top: 6px solid #c59b27; background: #fffcf5; font-family: 'Segoe UI', serif; }
.fa.tpl-dorado .h b { color: #8c6d12; font-family: 'Georgia', serif; letter-spacing: 1px; }
.fa.tpl-dorado table th { background: linear-gradient(135deg, #c59b27, #dfba4e); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
.fa.tpl-dorado .tt .gt { color: #8c6d12; border-top: 2px solid #c59b27; border-bottom: 2px solid #c59b27; }

/* 3. Azul Marino Corporativo */
.fa.tpl-marino { border-top: 6px solid #0f3460; background: #fbfdff; }
.fa.tpl-marino .h b { color: #0f3460; font-weight: 800; }
.fa.tpl-marino table th { background: #0f3460; color: #ffffff; }
.fa.tpl-marino .cl { border-left: 4px solid #16213e; padding-left: 10px; background: #f0f4f9; border-radius: 4px; padding: 8px 12px; }
.fa.tpl-marino .tt .gt { color: #0f3460; font-weight: 800; }

/* 4. Esmeralda Ejecutivo */
.fa.tpl-esmeralda { border-top: 6px solid #0d5c3a; background: #f6fbf8; }
.fa.tpl-esmeralda .h b { color: #0d5c3a; }
.fa.tpl-esmeralda table th { background: #0d5c3a; color: #fff; }
.fa.tpl-esmeralda .tt .gt { color: #0d5c3a; border-top: 2px solid #0d5c3a; }

/* 5. Minimalista Clean */
.fa.tpl-minimalista { border: 1px solid #e0e0e0; box-shadow: none; background: #fff; }
.fa.tpl-minimalista .h b { color: #111; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
.fa.tpl-minimalista table th { background: #fafafa; color: #333; border-bottom: 2px solid #222; }
.fa.tpl-minimalista table td { border-bottom: 1px solid #eee; }

/* 6. Violeta Cyber / Moderno */
.fa.tpl-violeta { border-top: 6px solid #7928ca; background: #fcfaff; }
.fa.tpl-violeta .h b { color: #7928ca; font-weight: 800; }
.fa.tpl-violeta table th { background: linear-gradient(135deg, #7928ca, #ff0080); color: #fff; }
.fa.tpl-violeta .tt .gt { color: #7928ca; }

/* 7. Rojo Burdeos Luxury */
.fa.tpl-burdeos { border-top: 6px solid #800020; background: #fffafb; }
.fa.tpl-burdeos .h b { color: #800020; }
.fa.tpl-burdeos table th { background: #800020; color: #fff; }
.fa.tpl-burdeos .tt .gt { color: #800020; border-top: 2px solid #800020; }

/* 8. Kraft Vintage */
.fa.tpl-kraft { background: #fcf6e8; border: 1px solid #d4c5a9; color: #3d3124; font-family: 'Courier New', Courier, monospace; }
.fa.tpl-kraft .h b { color: #4a3728; }
.fa.tpl-kraft table th { background: #e8dbbe; color: #3d3124; border: 1px solid #c9b996; }
.fa.tpl-kraft table td { border-bottom: 1px dashed #c9b996; }

/* 9. Sunset Degrade */
.fa.tpl-sunset { border-top: 6px solid #ff4e50; background: #fffdfb; }
.fa.tpl-sunset .h b { color: #f857a6; font-weight: 800; }
.fa.tpl-sunset table th { background: linear-gradient(135deg, #ff4e50, #f9d423); color: #fff; }
.fa.tpl-sunset .tt .gt { color: #ff4e50; }

/* 10. Dark Mode Pro */
.fa.tpl-dark { background: #18191a; color: #e4e6eb; border: 1px solid #333; }
.fa.tpl-dark .h b { color: #4e9af1; }
.fa.tpl-dark .h small, .fa.tpl-dark .ft { color: #999; }
.fa.tpl-dark .cl { background: #242526; color: #e4e6eb; }
.fa.tpl-dark table th { background: #242526; color: #4e9af1; border-bottom: 1px solid #444; }
.fa.tpl-dark table td { border-bottom: 1px solid #2d2e30; color: #ddd; }
.fa.tpl-dark .tt .gt { color: #4e9af1; border-top: 1px solid #444; }

/* 11. Plata Metalica */
.fa.tpl-silver { border-top: 6px solid #5a6268; background: #fdfdfd; }
.fa.tpl-silver .h b { color: #343a40; }
.fa.tpl-silver table th { background: linear-gradient(180deg, #495057, #343a40); color: #fff; }
.fa.tpl-silver .tt .gt { color: #212529; }

/* 12. Ticket POS 80mm */
.fa.tpl-pos { max-width: 320px !important; font-family: monospace; font-size: 11px; padding: 12px; background: #fff; margin: auto; border: 1px dashed #aaa; }
.fa.tpl-pos .lg { display: none; }
.fa.tpl-pos .h { flex-direction: column; text-align: center; }
.fa.tpl-pos .h div:last-child { text-align: center; margin-top: 6px; }
.fa.tpl-pos table th { background: none; color: #000; border-top: 1px dashed #000; border-bottom: 1px dashed #000; }
.fa.tpl-pos table td { border-bottom: none; }

/* --- SELLO DE ESTADO --- */
.stamp-wrap {
  position: absolute;
  top: 120px;
  right: 25px;
  z-index: 20;
  pointer-events: none;
  user-select: none;
}
.stamp-box {
  display: inline-block;
  padding: 6px 18px;
  text-transform: uppercase;
  font-family: 'Arial Black', 'Impact', sans-serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 4px;
  line-height: 1;
  text-align: center;
  border-radius: 8px;
  transform: rotate(-14deg);
  opacity: 0.88;
}
.stamp-cancelado {
  color: #d92d20;
  border: 4px double #d92d20;
  box-shadow: 0 0 0 2px #d92d20 inset, 0 2px 10px rgba(217, 45, 32, 0.2);
  background: rgba(217, 45, 32, 0.04);
}
.stamp-anulada {
  color: #7a1c1c;
  border: 4px solid #7a1c1c;
  box-shadow: 0 0 0 2px #7a1c1c inset;
  background: rgba(122, 28, 28, 0.05);
}
.stamp-credito {
  color: #d97706;
  border: 4px dashed #d97706;
  box-shadow: 0 0 0 2px #d97706 inset;
  background: rgba(217, 119, 6, 0.04);
  font-size: 20px;
}
.stamp-date {
  display: block;
  font-size: 10px;
  letter-spacing: 1.5px;
  margin-top: 3px;
  font-family: Arial, sans-serif;
  font-weight: 700;
}

/* Chat Emoji Picker */
.chat-emoji-wrap { position: relative; display: inline-flex; align-items: center; }
.chat-emoji-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: transform 0.15s; }
.chat-emoji-btn:hover { transform: scale(1.2); background: rgba(0,0,0,0.06); }
.chat-emoji-picker {
  position: absolute;
  bottom: 45px;
  left: 0;
  width: 280px;
  max-height: 220px;
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--borde);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  padding: 10px;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  z-index: 1000;
}
.chat-emoji-picker.on { display: grid; }
.chat-emoji-item {
  font-size: 20px;
  text-align: center;
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: background 0.15s, transform 0.1s;
}
.chat-emoji-item:hover { background: var(--fondo); transform: scale(1.25); }
